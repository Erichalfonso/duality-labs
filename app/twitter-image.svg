<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Duality Labs - Twitter Card Image (1200x600) -->

  <!-- Background with subtle gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#FAFAFA"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066FF"/>
      <stop offset="100%" style="stop-color:#0052CC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgGradient)"/>

  <!-- Accent line at top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGradient)"/>

  <!-- Psi Symbol -->
  <text
    x="600"
    y="240"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="160"
    font-weight="700"
    fill="#171717"
  >Ψ</text>

  <!-- Company Name -->
  <text x="600" y="410" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="600" letter-spacing="0.15em" fill="#171717">DUALITY LABS</text>

  <!-- Tagline -->
  <text x="600" y="460" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#737373">AI-Powered Solutions for Modern Business</text>

  <!-- Subtle corner accents -->
  <circle cx="80" cy="80" r="50" fill="#0066FF" opacity="0.05"/>
  <circle cx="1120" cy="520" r="70" fill="#0066FF" opacity="0.05"/>
</svg>
