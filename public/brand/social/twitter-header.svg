<svg width="1500" height="500" viewBox="0 0 1500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Twitter/X Header (1500x500) -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#FAFAFA"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066FF"/>
      <stop offset="100%" style="stop-color:#0052CC"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="500" fill="url(#bgGradient)"/>

  <!-- Accent line at top -->
  <rect x="0" y="0" width="1500" height="4" fill="url(#accentGradient)"/>

  <!-- Psi Symbol -->
  <text
    x="750"
    y="200"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="160"
    font-weight="700"
    fill="#171717"
  >Ψ</text>

  <!-- Company Name -->
  <text x="750" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="600" letter-spacing="0.15em" fill="#171717">DUALITY LABS</text>

  <!-- Tagline -->
  <text x="750" y="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#737373">AI-Powered Solutions for Modern Business</text>

  <!-- Subtle accents -->
  <circle cx="120" cy="100" r="70" fill="#0066FF" opacity="0.05"/>
  <circle cx="1380" cy="400" r="90" fill="#0066FF" opacity="0.05"/>
</svg>
