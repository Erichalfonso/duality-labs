<svg width="1584" height="396" viewBox="0 0 1584 396" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- LinkedIn Banner (1584x396) -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#FAFAFA"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066FF"/>
      <stop offset="100%" style="stop-color:#0052CC"/>
    </linearGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bgGradient)"/>

  <!-- Accent line at top -->
  <rect x="0" y="0" width="1584" height="4" fill="url(#accentGradient)"/>

  <!-- Psi Symbol -->
  <text
    x="792"
    y="160"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="140"
    font-weight="700"
    fill="#171717"
  >Ψ</text>

  <!-- Company Name -->
  <text x="792" y="290" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600" letter-spacing="0.15em" fill="#171717">DUALITY LABS</text>

  <!-- Tagline -->
  <text x="792" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="#737373">AI-Powered Solutions for Modern Business</text>

  <!-- Subtle accents -->
  <circle cx="100" cy="80" r="60" fill="#0066FF" opacity="0.05"/>
  <circle cx="1484" cy="316" r="80" fill="#0066FF" opacity="0.05"/>
</svg>
