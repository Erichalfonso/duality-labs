<svg width="1128" height="191" viewBox="0 0 1128 191" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- LinkedIn Company Page Banner (1128x191) - Anthropic style -->

  <rect width="1128" height="191" fill="#FAFAF9"/>

  <!-- "Build with" -->
  <text
    x="480"
    y="105"
