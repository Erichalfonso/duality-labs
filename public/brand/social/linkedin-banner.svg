<svg width="1128" height="191" viewBox="0 0 1128 191" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- LinkedIn Company Page Banner (1128x191) -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#FAFAFA"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066FF"/>
      <stop offset="100%" style="stop-color:#0052CC"/>
    </linearGradient>
  </defs>

  <rect width="1128" height="191" fill="url(#bgGradient)"/>

  <!-- Accent line at top -->
  <rect x="0" y="0" width="1128" height="3" fill="url(#accentGradient)"/>

  <!-- Psi Symbol -->
  <text
    x="564"
    y="75"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="70"
    font-weight="700"
    fill="#171717"
  >Ψ</text>

  <!-- Tagline -->
  <text x="564" y="145" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#737373">AI-Powered Solutions for Modern Business</text>

  <!-- Subtle accents -->
  <circle cx="60" cy="40" r="40" fill="#0066FF" opacity="0.05"/>
  <circle cx="1068" cy="151" r="50" fill="#0066FF" opacity="0.05"/>
</svg>
